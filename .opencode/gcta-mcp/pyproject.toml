[project]
name = "gcta-mcp"
version = "1.0.0"
description = "MCP server for GCTA (Genome-wide Complex Trait Analysis)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
gcta-mcp = "server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"
